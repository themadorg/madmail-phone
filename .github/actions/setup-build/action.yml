name: Prepare Android and engine toolchains
description: Install the shared, pinned build tools; no signing credentials required.
runs:
  using: composite
  steps:
    - name: Load tool versions
      shell: bash
      run: |
        sed -n '/^MADMAIL_/p' scripts/toolchain.env >> "$GITHUB_ENV"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: ${{ env.MADMAIL_UV_VERSION }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.MADMAIL_BUN_VERSION }}
    - name: Install native build prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libssl-dev protobuf-compiler nasm
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0' "ndk;$MADMAIL_NDK_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$MADMAIL_NDK_VERSION" >> "$GITHUB_ENV"
    - name: Build patched engine and launcher
      shell: bash
      run: ./scripts/prepare-engine.sh
