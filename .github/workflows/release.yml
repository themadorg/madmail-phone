name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tag and version
        run: bash scripts/check-release-version.sh
      - uses: ./.github/actions/setup-build
      - name: Validate before exposing signing credentials
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Sign and verify release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MADMAIL_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MADMAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MADMAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64 in the release environment}"
          : "${MADMAIL_STORE_PASSWORD:?Missing store password}"
          : "${MADMAIL_KEY_ALIAS:?Missing key alias}"
          : "${MADMAIL_KEY_PASSWORD:?Missing key password}"
          : "${EXPECTED_SIGNER_SHA256:?Set the expected release certificate SHA-256}"
          export MADMAIL_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$MADMAIL_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MADMAIL_KEYSTORE"
          unset KEYSTORE_BASE64
          ./scripts/sign-release.sh
      - name: Package APK and corresponding source
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: madmail-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checks-${{ github.sha }}
          path: app/build/reports/
          retention-days: 14

  # Publishing runs apart from signing: this job can write releases but never sees the signing secrets,
  # and the signing job can read secrets but never write to the repository.
  publish:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tag and version
        run: bash scripts/check-release-version.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: madmail-release-${{ github.sha }}
          path: dist
      - name: Verify the artifact before publishing
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum -c ./*-full.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^versionName=//p' release.properties)
          notes="docs/releases/$version.md"
          [ -s "$notes" ] || { echo "Write $notes before tagging" >&2; exit 1; }
          # Anything before 1.0, and any version with a suffix, ships as a prerelease.
          flags=()
          if [[ "$version" == *-* || "$version" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
            --title "Madmail Mobile $version" --notes-file "$notes" dist/*
